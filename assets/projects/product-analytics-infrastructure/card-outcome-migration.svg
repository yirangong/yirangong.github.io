<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Outcome-based analytics migration diagram</title>
  <desc id="desc">A four-stage flow from user outcome through request grain and attribution to migration.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d8ddd4" opacity="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9a8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#28322a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="570" rx="28" fill="#f7f8f4"/>
  <rect width="1200" height="570" rx="28" fill="url(#grid)"/>
  <text x="105" y="86" fill="#657064" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" letter-spacing="3">OUTCOME-BASED MEASUREMENT</text>

  <rect x="72" y="126" width="1056" height="334" rx="28" fill="#ffffff" stroke="#dfe4dc" filter="url(#shadow)"/>
  <path d="M 175 357 C 333 415, 787 415, 1025 357" fill="none" stroke="#dbe9f5" stroke-width="15" stroke-linecap="round"/>
  <text x="600" y="426" text-anchor="middle" fill="#4b6e8c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650" letter-spacing="2">SEMANTICS HOLD THROUGH MIGRATION</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.6">
    <g>
      <rect x="105" y="214" width="220" height="112" rx="20" fill="#edf6ff" stroke="#0874c9" stroke-width="2.5"/>
      <circle cx="145" cy="250" r="15" fill="#0874c9"/>
      <path d="M138 250l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="215" y="287" text-anchor="middle" fill="#0874c9">USER OUTCOME</text>
    </g>

    <path d="M 338 270 H 388" fill="none" stroke="#8f9a8c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="402" y="214" width="220" height="112" rx="20" fill="#fbfbf8" stroke="#c9d0c5" stroke-width="2"/>
      <text x="512" y="277" text-anchor="middle" fill="#273027">REQUEST GRAIN</text>
    </g>

    <path d="M 635 270 H 685" fill="none" stroke="#8f9a8c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="699" y="214" width="185" height="112" rx="20" fill="#fbfbf8" stroke="#c9d0c5" stroke-width="2"/>
      <text x="792" y="277" text-anchor="middle" fill="#273027">ATTRIBUTION</text>
    </g>

    <path d="M 897 270 H 947" fill="none" stroke="#8f9a8c" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="961" y="214" width="134" height="112" rx="20" fill="#fff7d9" stroke="#d4c67c" stroke-width="2"/>
      <text x="1028" y="277" text-anchor="middle" fill="#5b5122">MIGRATION</text>
    </g>
  </g>
</svg>
